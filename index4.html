


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

   
    background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
}


.todo-container{
    width:100%;
    max-width:550px;
    padding:35px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:28px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.1);

    animation: fadeIn 0.6s ease;
}


.todo-header{
    text-align:center;
    margin-bottom:30px;
}

.todo-header h1{
    font-size:2.5rem;
    color:white;
    letter-spacing:1px;
    font-weight:700;
}


.todo-input-container{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:25px;
}

.todo-input,
.time-input,
.date-input{
    flex:1;
    min-width:140px;

    padding:15px;
    border:none;
    outline:none;

    border-radius:14px;

    background: rgba(255,255,255,0.12);
    color:white;

    font-size:15px;

    transition:0.3s;
}

.todo-input::placeholder{
    color:#ddd;
}

.todo-input:focus,
.time-input:focus,
.date-input:focus{
    transform: translateY(-2px);
    background: rgba(255,255,255,0.18);
    box-shadow:0 0 0 3px rgba(96,165,250,0.4);
}


.add-btn{
    padding:15px 22px;
    border:none;
    border-radius:14px;

    background: linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;

    font-weight:600;
    cursor:pointer;

    transition:0.3s;
}

.add-btn:hover{
    transform:translateY(-3px) scale(1.03);

    box-shadow:
        0 10px 20px rgba(37,99,235,0.4);
}


.filter-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.filter-btn{
    padding:10px 20px;
    border:none;
    border-radius:30px;

    background: rgba(255,255,255,0.12);
    color:white;

    cursor:pointer;
    transition:0.3s;
}

.filter-btn:hover{
    transform:translateY(-2px);
    background: rgba(255,255,255,0.2);
}

.filter-btn.active{
    background: linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;

    box-shadow:0 8px 18px rgba(37,99,235,0.4);
}


.todo-list{
    list-style:none;
}


.todo-item{
    display:flex;
    align-items:center;
    gap:14px;

    padding:18px;
    margin-bottom:15px;

    border-radius:18px;

    background: rgba(255,255,255,0.1);

    border:1px solid rgba(255,255,255,0.08);

    transition:0.3s;
}

.todo-item:hover{
    transform:translateY(-3px);
    background: rgba(255,255,255,0.15);
}


.todo-item.overdue{
    background: rgba(255,0,0,0.12);
    border-left:5px solid #ff4d4d;
}


.todo-text{
    color:white;
    font-size:15px;
    line-height:1.5;
    word-break:break-word;
}

.todo-text.completed{
    text-decoration:line-through;
    opacity:0.6;
}


.checkbox{
    width:20px;
    height:20px;
    cursor:pointer;
}


.delete-btn{
    margin-left:auto;

    width:34px;
    height:34px;

    border:none;
    border-radius:50%;

    background: linear-gradient(135deg,#ff4d4d,#dc2626);
    color:white;

    font-size:18px;
    cursor:pointer;

    transition:0.3s;
}

.delete-btn:hover{
    transform:scale(1.1) rotate(90deg);

    box-shadow:
        0 8px 18px rgba(255,77,77,0.4);
}


@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


@media(max-width:600px){

    .todo-container{
        padding:25px;
    }

    .todo-header h1{
        font-size:2rem;
    }

    .todo-input-container{
        flex-direction:column;
    }

    .add-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="todo-container">

    <div class="todo-header">
        <h1>Todo List</h1>
    </div>

    <div class="todo-input-container">
        <input type="text" class="todo-input" id="taskInput" placeholder="Add a new task...">
        <input type="date" class="date-input" id="dateInput">
        <input type="time" class="time-input" id="timeInput">
        <button class="add-btn">Add Task</button>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Pending</button>
        <button class="filter-btn">Completed</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

</div>

<script>
const taskInput = document.getElementById("taskInput");
const timeInput = document.getElementById("timeInput");
const dateInput = document.getElementById("dateInput");
const addBtn = document.querySelector(".add-btn");
const todoList = document.getElementById("todoList");
const filterBtns = document.querySelectorAll(".filter-btn");

addBtn.addEventListener("click", () => {
    const text = taskInput.value.trim();
    const time = timeInput.value;
    const date = dateInput.value;

    if (text === "") return;

    const li = document.createElement("li");
    li.className = "todo-item pending";

    let isOverdue = false;
    if (date && time) {
        const now = new Date();
        const taskDate = new Date(`${date}T${time}`);
        if (taskDate < now) isOverdue = true;
    }

    li.innerHTML = `
        <input type="checkbox" class="checkbox">
        <span class="todo-text">
            ${text} 
            ${date ? "📅 " + date : ""} 
            ${time ? "⏱ " + time : ""}
        </span>
        <button class="delete-btn">×</button>
    `;

    if (isOverdue) {
        li.classList.add("overdue");
    }

    todoList.appendChild(li);

    taskInput.value = "";
    timeInput.value = "";
    dateInput.value = "";
});

todoList.addEventListener("click", (e) => {
    const item = e.target.closest(".todo-item");

    if (e.target.classList.contains("delete-btn")) {
        item.remove();
    }

    if (e.target.classList.contains("checkbox")) {
        item.classList.toggle("completed");
        item.classList.toggle("pending");

        item.querySelector(".todo-text")
            .classList.toggle("completed");
    }
});

filterBtns.forEach((btn, index) => {
    btn.addEventListener("click", () => {
        document.querySelector(".filter-btn.active")
            .classList.remove("active");

        btn.classList.add("active");

        const items = document.querySelectorAll(".todo-item");

        items.forEach(item => {
            if (index === 0) {
                item.style.display = "flex";
            } 
            else if (index === 1) {
                item.style.display =
                    item.classList.contains("pending") ? "flex" : "none";
            } 
            else {
                item.style.display =
                    item.classList.contains("completed") ? "flex" : "none";
            }
        });
    });
});

taskInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") addBtn.click();
});
</script>

</body>
</html>
